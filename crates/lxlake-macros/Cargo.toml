[package]
name = "lxlake-macros"
description = "lxlake 的 proc-macro（#[lxlake::entry]）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full", "extra-traits"] }

[lints.rust]
# Windows 上 proc-macro 编成 cdylib，链接器会把「正在创建 xxx.dll.lib」打到 stdout，
# rustc 的 linker_messages 就会报一条。这条对 proc-macro 是常态，不是缺陷。
linker_messages = "allow"
