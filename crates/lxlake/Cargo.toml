[package]
name = "lxlake"
description = "跨平台应用框架 + 游戏引擎能力（唯一实体库）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# 唯一立刻成立的独立 crate：proc-macro 只能是独立 crate（Cargo 硬约束）。
lxlake-macros = { workspace = true }

# 基础依赖：开窗是框架主线（runtime + platform）的能力，不属于 render。
# 不开 render 的空窗口也必须能跑，故 winit 不是 optional。
# android 的后端由 winit 自己带（`android-game-activity`，见文末的 target 分档），而
# `AndroidApp` 也由 winit 再导出，因此不直接依赖 android-activity / ndk / jni。
winit = "0.30.13"

# 渲染（M1 起实装）：分三档、单调递增，全部落在 feature 之后（见 docs/architecture.md
# 的「feature 分档」）。三档不是按概念切的，是按**消费者**切的：
#   gpu        设备 / 队列 / 表面 / 配置 / resize / 取帧 / present——地板档
#   ui-render  + render/ui.rs：方片管线与 UI 字形图集（框架主线的自绘 UI 走这一档）
#   render     + 3D：管线 / 方块图集 / shader.wgsl / 深度与阴影 / 区块资源
wgpu = { version = "30", optional = true }

# raw-window-handle 是**中性 ABI 契约**，不是 winit / wgpu 的类型：`core::window::WindowHandle`
# 拿它表达「我能给出原生窗口句柄」，渲染侧因此能直接建表面而不必认识 winit。winit 与 wgpu
# 本来就用它，依赖图上零增量。
raw-window-handle = "0.6"
# 顶点 / uniform 的字节视图：CPU 结构与 GPU 布局的对照由 `Pod` 在编译期锁住。
# wgpu 自己就依赖它，开渲染时依赖图上零增量；`ui-render` 起才需要（UI 顶点要它），
# 只开 `gpu` 则连它一起省掉（见 `meshing::Vertex`）。
bytemuck = { version = "1", features = ["derive"], optional = true }
glam = "0.33.9"
crossbeam-deque = "0.8.8"

# 文本（M3 起）：UI 排版与字形光栅化。ab_glyph 是纯 Rust 的轻量字体库，属 glam 同级的普通依赖
# ——不加 feature 门，因为框架主线（不开 render）同样要自绘 UI 文本，而它不碰任何 GPU 类型。
ab_glyph = "0.2"

# 项目清单（M3 起）：读 `lxlake.toml`。与 ab_glyph 同档的普通依赖——开项目与打日志一样是框架
# 主线的事，不开 render 也要读。**只在 `project` 模块用**，且不引 serde 派生（手工取字段，
# 为了中文诊断与行列定位，见 project.rs）。
toml = "0.8"

# 日志门面：tracing 的宏不是平台类型，可以出现在 core / path。
tracing = "0.1"
# 订阅器与轮转 appender：**安装**发生在平台入口（见 runtime/log.rs 的数据与安装分离），
# 与 core / winit 都无关，故不是 optional。
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "tracing-log"] }
tracing-appender = "0.2"

# 异步：只开 rt 类特性（rt / rt-multi-thread / time / sync），**不碰 net / io 驱动**——
# 网络与文件 I/O 由将来具体的 capability 按需自己加特性，框架主线不无谓地拉进 mio。
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync"] }

[features]
default = []
# 渲染三档，单调递增：gpu ⊂ ui-render ⊂ render。
# 只开 `gpu` 的消费者是**将来**的 CEF 纹理模式（要设备 / 队列 / 表面 / 取帧与纹理导入，
# 但不要方片管线），今天还没有调用方——守卫只有 `cargo build -p lxlake --features gpu`。
gpu = ["dep:wgpu"]
ui-render = ["gpu", "dep:bytemuck"]
render = ["ui-render"]
# Windows 上的 wry 覆盖层后端：`capability::webview` 的重依赖那一半，实装见
# `capability/webview/wry.rs`。特性不开（或不在 Windows）时由同目录的 `unsupported.rs` 垫底，
# 能力查询答「不支持」——于是没有后端也不影响框架主线编译。
webview-wry = ["dep:wry"]

# 目标分档：android 的后端（activity 生命周期、surface）由 winit 自带的 `android-game-activity`
# 特性提供。平台后端分档一律走 `cfg(target_os)`，不用 feature（见 docs/architecture.md）——
# 这里加的也是**依赖特性**，不是框架 feature。
[target.'cfg(target_os = "android")'.dependencies]
winit = { version = "0.30.13", features = ["android-game-activity"] }

# wry 目前只在 Windows 上有实装（WebView2）；其余平台走 `unsupported.rs` 的 fail-closed 路径，
# 因此 Linux 不必引 webkit2gtk 那套系统依赖。这里必须是**目标专有**的可选依赖：`dep:wry` 的写法
# 是硬要求——目标专有的可选依赖不会生成同名隐式特性。
[target.'cfg(target_os = "windows")'.dependencies]
wry = { version = "0.57", optional = true }
